<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Empanadas El Buen Sabor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">
        <img src="logo.png">
    </div>

    <nav>
        <a href="#">INICIO</a>
        <a href="#">EMPANADAS</a>
        <a href="#">OTROS</a>
        <a href="#">NOSOTROS</a>
    </nav>

    <div class="user" onclick="abrirModal()">Ingreso/registro</div>
</header>

<h2 class="titulo">INICIO/OTRAS</h2>

<div class="resultados">Mostrando los 2 resultados</div>

<div class="container">

    <!-- PRODUCTO 1 -->
    <div class="card">
        <img src="papa.png">
        <p>papa rellena</p>
        <div class="precio">$2.000</div>

        <div class="contador">
            <button onclick="cambiarCantidad(0, -1)">-</button>
            <span id="cant0">0</span>
            <button onclick="cambiarCantidad(0, 1)">+</button>
        </div>

        <button class="agregar" onclick="agregarCarrito(0, 'papa rellena', 2000)">
            Añadir al carrito
        </button>
    </div>

    <!-- PRODUCTO 2 -->
    <div class="card">
        <img src="cochinitos.png">
        <p>Cochinitos</p>
        <div class="precio">$2.000</div>

        <div class="contador">
            <button onclick="cambiarCantidad(1, -1)">-</button>
            <span id="cant1">0</span>
            <button onclick="cambiarCantidad(1, 1)">+</button>
        </div>

        <button class="agregar" onclick="agregarCarrito(1, 'Cochinitos', 2000)">
            Añadir al carrito
        </button>
    </div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
    <div class="modal-content">
        <h3>Ingreso / Registro</h3>
        <input type="text" placeholder="Usuario">
        <input type="password" placeholder="Contraseña">
        <button onclick="login()">Ingresar</button>
        <button onclick="cerrarModal()">Cerrar</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
